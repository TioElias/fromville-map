<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=./web/">
    <title>Fromville Interactive Map</title>
    <script type="text/javascript">
        window.location.href = "./web/";
    </script>
    <style>
        body {
            background-color: #07090e;
            color: #f0f3f6;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .loader-container {
            text-align: center;
        }
        .loader {
            border: 4px solid rgba(139, 0, 0, 0.1);
            border-top: 4px solid #8b0000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        a {
            color: #d4af37;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="loader"></div>
        <p>Entering Fromville... If you are not redirected automatically, <a href="./web/">click here to enter the map</a>.</p>
    </div>
</body>
</html>
