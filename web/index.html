<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fromville Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Google Fonts: Inter, IM Fell English, Special Elite -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Inter:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Sidebar Overlay (Mobile responsive backdrop) -->
        <div id="sidebar-overlay"></div>
        
        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-content">
                <div class="header">
                    <h1>FROMVILLE</h1>
                    <p class="subtitle">🔴 SURVIVAL INTERACTIVE MAP 🔴</p>
                </div>
                
                <!-- Night Mode Toggle Switch (Premium immersive feature) -->
                <div class="night-mode-container">
                    <span class="night-mode-label">🛡️ TALISMAN NIGHT SHIELD</span>
                    <label class="switch">
                        <input type="checkbox" id="toggle-night-mode">
                        <span class="slider round"></span>
                    </label>
                </div>

                <div class="header-actions">
                    <button id="btn-show-all">SHOW ALL</button>
                    <span class="separator">|</span>
                    <button id="btn-hide-all">HIDE ALL</button>
                </div>
                
                <div class="search-container">
                    <input type="text" id="search-bar" placeholder="Search locations...">
                </div>
                
                <div class="filters-container">
                    <h2 class="filters-title">CATEGORIES</h2>
                    <label class="filter-toggle">
                        <span class="filter-label">🏡 Safe Houses <span class="count-badge" id="count-safe-houses">0</span></span>
                        <input type="checkbox" id="toggle-safe-houses" checked>
                        <span class="slider"></span>
                    </label>
                    <label class="filter-toggle">
                        <span class="filter-label">🌲 Landmarks <span class="count-badge" id="count-landmarks">0</span></span>
                        <input type="checkbox" id="toggle-landmarks" checked>
                        <span class="slider"></span>
                    </label>
                </div>


                
                <div class="location-list-container">
                    <div id="location-list">
                        <!-- Location items will be injected here via JS -->
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Map Area -->
        <main id="map-container">
            <button id="btn-toggle-sidebar" class="map-floating-btn">☰</button>
            <div id="map"></div>
            
            <!-- Floating Audio Controls (Immersive design) -->
            <div class="floating-audio-controls">
                <button id="btn-mute" class="audio-btn">🔊</button>
                <div class="expanded-controls">
                    <div class="track-info">
                        <span id="now-playing" class="track-marquee">NOW PLAYING: FROM OST</span>
                    </div>
                    <div class="audio-actions">
                        <button id="btn-prev-song" class="audio-btn mini-btn">⏮️</button>
                        <button id="btn-next-song" class="audio-btn mini-btn">⏭️</button>
                    </div>
                    <div class="slider-container">
                        <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="0.3">
                    </div>
                </div>
                <audio id="bg-audio" src="assets/Song/FROM SONG.mp3" autoplay></audio>
            </div>
        </main>

        <!-- Info Panel (Atmospheric Horror Dossier) -->
        <div id="info-overlay" class="hidden"></div>
        <div id="info-panel" class="hidden">
            <div class="image-gallery">
                <button id="btn-prev-image" class="gallery-nav">&lt;</button>
                <div id="gallery-container">
                    <!-- Images will be injected here via JS -->
                </div>
                <button id="btn-next-image" class="gallery-nav">&gt;</button>
                <span id="gallery-counter" class="gallery-badge">1 / 1</span>
                <button id="btn-close-info">×</button>
            </div>
            
            <div class="info-content-wrapper">
                <div class="info-header">
                    <h2 id="info-title">Location Name</h2>
                    <div class="info-meta">
                        <span id="info-category">Category</span>
                        <span id="info-status-badge" class="talisman-shield-badge">🛡️ TALISMAN PROTECTED</span>
                    </div>
                </div>
                <hr class="divider">
                <div class="info-description-container">
                    <p id="info-desc">Description goes here.</p>
                </div>
            </div>
        </div>

        <!-- Fullscreen Image Modal -->
        <div id="fullscreen-overlay" class="hidden">
            <img id="fullscreen-image" src="" alt="Fullscreen">
            <button id="btn-close-fullscreen">X</button>
        </div>

        <!-- Mobile Sidebar Overlay -->
        <div id="sidebar-overlay" class="hidden"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Local Fallback Data (CORS policy bypass) -->
    <script src="data-fallback.js"></script>
    
    <!-- Custom Logic -->
    <script src="map-logic.js"></script>
</body>
</html>
